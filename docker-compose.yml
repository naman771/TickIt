services:
  # ── PostgreSQL Database ─────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: tickit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tickit
      POSTGRES_USER: tickit
      POSTGRES_PASSWORD: tickit
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tickit -d tickit"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis (Hold locks & Token-Bucket Rate Limiting) ──────
  redis:
    image: redis:7-alpine
    container_name: tickit-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── TickIt Spring Boot Application ──────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tickit-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: tickit
      DB_USER: tickit
      DB_PASS: tickit
      REDIS_HOST: redis
      REDIS_PORT: 6379
      APP_AUTH_MODE: ${APP_AUTH_MODE:-catalog}
      CLERK_ISSUER: ${CLERK_ISSUER:-}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:-}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      AUTH_ALLOWED_ORIGINS: ${AUTH_ALLOWED_ORIGINS:-}
      DEVELOPER_SUBJECTS: ${DEVELOPER_SUBJECTS:-}
      DEVELOPER_HOST: ${DEVELOPER_HOST:-developers.tickit.site}
      APP_SEED_ENABLED: ${APP_SEED_ENABLED:-false}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-smtp.resend.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-resend}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
