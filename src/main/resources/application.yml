spring:
  application:
    name: tickit

  jackson:
    deserialization:
      accept-float-as-int: false

  # ── PostgreSQL ──────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tickit}
    username: ${DB_USER:tickit}
    password: ${DB_PASS:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate          # Flyway owns the schema
    open-in-view: true
    properties:
      hibernate:
        format_sql: true

  # ── Flyway ──────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration

  # ── Redis ───────────────────────────────────────────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      repositories:
        enabled: false

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  # ── Email ───────────────────────────────────────────────
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASS:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# ── Application ─────────────────────────────────────────
app:
  organizer:
    host: ${ORGANIZER_HOST:organizers.tickit.site}
  storage:
    enabled: ${APP_STORAGE_ENABLED:false}
    bucket: ${NEON_STORAGE_BUCKET:assets}
  developer:
    host: ${DEVELOPER_HOST:developers.tickit.site}
  seed:
    enabled: ${APP_SEED_ENABLED:false}
  auth:
    mode: ${APP_AUTH_MODE:catalog}
    developer-subjects: ${DEVELOPER_SUBJECTS:}
    issuer: ${CLERK_ISSUER:}
    publishable-key: ${CLERK_PUBLISHABLE_KEY:}
    secret-key: ${CLERK_SECRET_KEY:}
    allowed-origins: ${AUTH_ALLOWED_ORIGINS:}
  seat-hold:
    ttl-seconds: 120              # How long a seat is held before auto-release
  rate-limit:
    capacity: 20                  # Max tokens per bucket
    refill-rate: 5                # Tokens added per second
  email:
    from: ${EMAIL_FROM:noreply@tickit.live}
    enabled: ${EMAIL_ENABLED:false}

# ── Actuator ─────────────────────────────────────────────
management:
  health:
    mail:
      enabled: ${EMAIL_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: 8080

logging:
  level:
    com.tickit: INFO
    org.springframework.web.socket: WARN
