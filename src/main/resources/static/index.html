<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Discover live music and unforgettable experiences. Choose your seat and reserve it in real time with TickIt."
    />
    <meta name="theme-color" content="#f7f7f2" />
    <title>TickIt — Be there.</title>
    <link rel="icon" href="/images/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/css/style.css" />
    <script defer src="/vendor/sockjs.min.js"></script>
    <script defer src="/vendor/stomp.min.js"></script>
    <script defer src="/js/app.js"></script>
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="#events" aria-label="TickIt home"
          ><svg viewBox="0 0 28 28" fill="none" aria-hidden="true">
            <path
              d="M4 7h20v5a2 2 0 0 0 0 4v5H4v-5a2 2 0 0 0 0-4V7Z"
              stroke="currentColor"
              stroke-width="1.8"
            />
            <path
              d="M17 8v3m0 3v2m0 2v2"
              stroke="currentColor"
              stroke-width="1.5"
            /></svg
          >tickit<span class="brand-period">.</span></a
        >
        <nav aria-label="Main navigation">
          <a href="#events" data-nav="events">Discover</a
          ><a href="#tickets" data-nav="tickets">My tickets</a
          ><a href="#about" data-nav="about">The project</a>
        </nav>
        <div class="header-account">
          <span class="account-caption">DEMO ACCOUNT</span
          ><label class="account-select"
            ><svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
              <circle
                cx="10"
                cy="6"
                r="3"
                stroke="currentColor"
                stroke-width="1.4"
              />
              <path
                d="M4 17v-2a6 6 0 0 1 12 0v2"
                stroke="currentColor"
                stroke-width="1.4"
              /></svg
            ><select id="userSelect" aria-label="Demo account">
              <option value="1">Alex Morgan</option>
              <option value="2">Sam Taylor</option>
              <option value="3">Jordan Lee</option>
            </select></label
          >
        </div>
      </div>
    </header>
    <main id="app">
      <div class="loading-state">
        <span class="loader"></span>Finding your next experience…
      </div>
    </main>
    <footer class="site-footer">
      <div class="footer-inner">
        <a href="#events" class="brand"
          >tickit<span class="brand-period">.</span></a
        >
        <p>Less scrolling. More being there.</p>
        <span
          >A ticketing MVP by Naman <span class="footer-dot">·</span>
          <a
            href="https://github.com/naman771/TickIt"
            target="_blank"
            rel="noopener"
            >View source ↗</a
          ></span
        >
      </div>
      <div class="footer-note">
        Demonstration only. Reservations use simulated accounts and no payment
        is collected.
      </div>
    </footer>
    <div id="notifications" class="notifications" aria-live="polite"></div>
    <dialog
      id="confirmationDialog"
      class="confirmation-dialog"
      aria-labelledby="confirmationTitle"
    ></dialog>
  </body>
</html>
