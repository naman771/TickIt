spring:
  datasource:
    url: ${TEST_DATABASE_URL:jdbc:postgresql://localhost:5432/tickit_test}
    username: ${DB_USER:tickit}
    password: ${DB_PASS:}
  data:
    redis:
      database: 15
  jpa:
    open-in-view: true
logging:
  level:
    com.tickit: WARN

app:
  rate-limit:
    capacity: 10000 # Business-flow fixtures; dedicated rate-limit tests use the real 20-token policy.
  seed:
    enabled: true
  auth:
    mode: test
  tickets:
    recovery-enabled: false
  notifications:
    scheduled-enabled: false
