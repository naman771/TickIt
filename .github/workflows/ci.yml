name: Build and test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tickit_test
          POSTGRES_USER: tickit
          POSTGRES_PASSWORD: tickit
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tickit -d tickit_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DB_USER: tickit
      DB_PASS: tickit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B verify
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Verify preinstalled Chrome
        run: google-chrome --version
      - run: npm run test:browser
        env:
          PLAYWRIGHT_BROWSER_CHANNEL: chrome
      - run: node --check src/main/resources/static/js/app.js
      - run: node --check src/main/resources/static/js/tickets.js
      - run: node --check src/main/resources/static/organizer/operations.js
      - run: node --check src/main/resources/static/organizer/entry.js
      - run: node --check src/main/resources/static/js/auth.js
      - run: node --check src/main/resources/static/developer/portal.js
      - run: node --check src/main/resources/static/organizer/organizer.js
      - run: node scripts/build-organizer.mjs
      - run: bash -n scripts/rate_limit_probe.sh
      - run: docker compose config --quiet
      - run: docker build -t tickit:ci .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: target/surefire-reports/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: |
            playwright-report/
            test-results/
